name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run check:ui
      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        run: npm run commitlint -- --from "origin/${GITHUB_BASE_REF}" --to HEAD
      - name: Check merged commits
        if: github.event_name == 'push'
        run: npm run commitlint -- --from "${{ github.event.before }}" --to "${{ github.sha }}"
